<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Z-Mon Teams</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #1e2230; color: #f2f2f2; }
  header { padding: 22px 20px 6px; text-align: center; }
  header h1 { margin: 0; font-size: 34px; letter-spacing: 1px; }
  header .by { margin-top: 6px; font-size: 18px; color: #b9bfd3; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .mon { background: #2b3044; border-radius: 14px; padding: 16px 18px; border: 2px solid #3a4060; }
  .mon .top { font-size: 20px; font-weight: bold; }
  .mon .top .at { color: #b9bfd3; font-weight: normal; }
  .types { margin: 8px 0 10px; }
  .type { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: bold; color: #fff; margin-right: 6px; }
  .line { font-size: 16px; margin: 4px 0; }
  .label { color: #b9bfd3; }
  .moves { margin-top: 10px; }
  .move { font-size: 16px; margin: 4px 0; }
  .move .dash { color: #b9bfd3; margin-right: 6px; }
  .empty { color: #7d849c; font-style: italic; }
  .msg { text-align: center; font-size: 18px; color: #b9bfd3; margin: 40px auto; max-width: 640px; line-height: 1.5; }
  .load { display: flex; gap: 8px; max-width: 640px; margin: 0 auto; }
  .load input { flex: 1; padding: 12px 14px; font-size: 16px; font-family: Arial, Helvetica, sans-serif; border-radius: 10px; border: none; }
  .load button { padding: 12px 18px; font-size: 16px; font-family: Arial, Helvetica, sans-serif; font-weight: bold; border-radius: 10px; border: none; background: #4a6cf7; color: #fff; cursor: pointer; }
  .bad { color: #ff8a80; }
</style>
</head>
<body>
<header>
  <h1 id="teamName">Z-Mon Teams</h1>
  <div class="by" id="byLine"></div>
</header>
<main id="main"></main>

<script>
// =====================================================================
// Z-Mon Teams: shows a team from the Team ID at the end of the link
// (https://therealzaxon.github.io/Z-Mon_Teams/?<Team ID>). No server needed.
//
// IMPORTANT: MOVES and ITEMS must match TEAM_ID_MOVES and TEAM_ID_ITEMS in control.gd,
// in the same order. They are "append only": new ones go at the END, never reorder or remove.
// =====================================================================
const TEAM_ID_VERSION = 1;
const TEAM_ID_CHARS = "0123456789abcdefghijklmnopqrstuvwxyz";
const EV_ORDER = ["HP", "ATK", "SPA", "DEF", "SPD", "SPE"];
const EV_COLORS = { HP: "#ff5a52", ATK: "#ff9f43", SPA: "#ffd23f", DEF: "#4cd97b", SPD: "#4aa8ff", SPE: "#b57bff" };

const TYPE_COLORS = {
  Fire: "#E8742C", Plant: "#4DA64D", Water: "#3B82D6", Earth: "#9A7B4F",
  Electric: "#C9A227", Wind: "#7A8FD6", Frost: "#56B7D4", Neutral: "#7D7D7D"
};

// [move name, move type] in Team ID order
const MOVES = [
  ["Fire Punch","Fire"], ["Flare Blitz","Fire"], ["Flame Kick","Fire"], ["Flame Jet","Fire"], ["Flame Charge","Fire"],
  ["Flamethrower","Fire"], ["Overheat","Fire"], ["Heatwave","Fire"], ["Fire Spin","Fire"], ["Blaze Blast","Fire"],
  ["Leaf Blade","Plant"], ["Wood Hammer","Plant"], ["Horn Leech","Plant"], ["Leafnado","Plant"], ["Energy Ball","Plant"],
  ["Leaf Storm","Plant"], ["Giga Drain","Plant"], ["Root Trap","Plant"], ["Florae Frenzy","Plant"],
  ["Waterfall","Water"], ["Wave Crash","Water"], ["Fish Slap","Water"], ["Water Wave","Water"], ["Aqua Beam","Water"],
  ["Hydro Pump","Water"], ["Tsunami","Water"], ["Whirlpool","Water"], ["Cascade Cannon","Water"],
  ["Earthquake","Earth"], ["Rock Knuckles","Earth"], ["Rockslide","Earth"], ["Boulder Bash","Earth"], ["Earth Power","Earth"], ["Sand Coffin","Earth"],
  ["Volt Tackle","Electric"], ["Chidori","Electric"], ["Thunderbolt","Electric"], ["Lightning","Electric"], ["Volt Switch","Electric"],
  ["Tornado","Wind"], ["Hurricane","Wind"],
  ["Avalanche","Frost"], ["Frost Beam","Frost"], ["Blizzard","Frost"], ["Icy Wind","Frost"],
  ["Double Edge","Neutral"], ["Fake Out","Neutral"], ["Swords Dance","Neutral"], ["Dragon Dance","Neutral"],
  ["Will-O-Wisp","Fire"], ["Frostbite","Frost"], ["Thunder Wave","Electric"], ["Tailwind","Wind"], ["Helping Hand","Neutral"],
  ["Trick Room","Neutral"], ["Disable","Neutral"], ["Encore","Neutral"], ["Taunt","Neutral"],
  ["Aeroblast","Wind"], ["Snarl","Neutral"], ["Parting Shot","Neutral"], ["We Are Charlie Kirk","Neutral"], ["Wham Slam","Neutral"],
  ["Ice Clone","Frost"], ["Kamehameha","Neutral"], ["Flash Freeze Heatwave","Fire"], ["Water Wheel","Water"],
  ["Cosmic Power","Neutral"],
  ["Close Combat","Neutral"], ["Rage Powder","Plant"], ["Light Screen","Neutral"], ["Reflect","Neutral"]
];

const ITEMS = ["Assault Vest", "Choice Band", "Choice Scarf", "Choice Specs", "Focus Sash", "Leftovers", "Life Orb", "Sitrus Berry",
  "Covert Cloak", "Rocky Helmet", "Lum Berry", "Eject Button", "Power Herb", "White Herb", "Clear Amulet", "Weakness Policy", "Shed Shell", "Mental Herb"];

// number: [name, types, ability]
const MONSTERS = {
  1: ["Charlie Kirk", ["Fire"], "Master Debater"],
  2: ["Hashirama", ["Plant"], "Sage Regeneration"],
  3: ["Fishstick", ["Water"], "Panic Mode"],
  4: ["Whomp", ["Earth"], "The Wall"],
  5: ["Killua", ["Electric"], "Godspeed"],
  6: ["Naruto", ["Wind"], "Nine-Tails Chakra"],
  7: ["Sub-Zero", ["Frost"], "Cryomancer's Guard"],
  8: ["Kid Goku", ["Neutral"], "Saiyan Spirit"],
  9: ["Todoroki", ["Fire", "Frost"], "Elemental Resilience"],
  10: ["Swamp Thing", ["Plant", "Earth"], "Nature's Blessing"],
  11: ["Giyu", ["Water", "Neutral"], "Dead Calm"],
  12: ["Storm", ["Electric", "Wind"], "Elemental Mastery"]
};

const PLAYER_NAME = "Default User";   // no player names in the game yet

// ---------- Team ID decoding (same as decode_team_id in control.gd) ----------
function bitsPush(bits, value, width) {
  for (let i = width - 1; i >= 0; i--) bits.push((value >> i) & 1);
}
function bitsRead(r, width) {
  let v = 0;
  for (let i = 0; i < width; i++) {
    v = v << 1;
    if (r.pos >= r.bits.length) r.bad = true;
    else v = v | r.bits[r.pos];
    r.pos++;
  }
  return v;
}
function stripQuotes(s) { return s.replace(/["“”„‟]/g, ""); }

function decodeTeamId(text) {
  let code = String(text || "").trim().toLowerCase();
  let cut = -1;
  for (const sep of ["?", "#", "/", "="]) cut = Math.max(cut, code.lastIndexOf(sep));
  if (cut !== -1) code = code.substring(cut + 1);
  code = code.replace(/ /g, "");
  if (code === "") return null;
  const num = [];
  for (const ch of code) {
    const d = TEAM_ID_CHARS.indexOf(ch);
    if (d === -1) return null;
    let carry = d;
    for (let i = num.length - 1; i >= 0; i--) {
      const v = num[i] * 36 + carry;
      num[i] = v % 256;
      carry = Math.floor(v / 256);
    }
    while (carry > 0) { num.unshift(carry % 256); carry = Math.floor(carry / 256); }
  }
  const bits = [];
  for (const b of num) bitsPush(bits, b, 8);
  const r = { bits: bits, pos: 0, bad: false };
  if (bitsRead(r, 4) !== TEAM_ID_VERSION) return null;
  const nameLen = bitsRead(r, 7);
  const nameBytes = new Uint8Array(nameLen);
  for (let i = 0; i < nameLen; i++) nameBytes[i] = bitsRead(r, 8);
  let teamName = Array.from(stripQuotes(new TextDecoder().decode(nameBytes))).slice(0, 16).join("");
  if (teamName.trim() === "") teamName = "Team";
  const mons = [];
  let anyMon = false;
  for (let s = 0; s < 8; s++) {
    if (bitsRead(r, 1) === 0) { mons.push(null); continue; }
    const n = bitsRead(r, 9);
    const itemId = bitsRead(r, 6);
    const moveCount = bitsRead(r, 3);
    const moves = [];
    for (let m = 0; m < moveCount; m++) {
      const mid = bitsRead(r, 7);
      if (mid < MOVES.length && !moves.includes(mid)) moves.push(mid);
    }
    let evs = null;
    if (bitsRead(r, 1) === 1) {
      evs = {};
      for (const st of EV_ORDER) evs[st] = bitsRead(r, 6);
    }
    const item = (itemId >= 1 && itemId <= ITEMS.length) ? ITEMS[itemId - 1] : "";
    mons.push({ n: n, item: item, moves: moves.slice(0, 4), evs: evs });
    anyMon = true;
  }
  if (r.bad || !anyMon) return null;
  return { name: teamName, mons: mons };
}

// ---------- Page ----------
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function showTeam(team) {
  document.title = team.name + " - Z-Mon Teams";
  document.getElementById("teamName").textContent = team.name;
  document.getElementById("byLine").textContent = "by " + PLAYER_NAME;
  const main = document.getElementById("main");
  main.innerHTML = "";
  const grid = el("div", "grid");
  for (const m of team.mons) {
    if (m === null) continue;
    const info = MONSTERS[m.n] || ["Unknown Monster (No. " + m.n + ")", [], "???"];
    const card = el("div", "mon");

    const top = el("div", "top", info[0]);
    if (m.item) {
      top.appendChild(el("span", "at", " @ "));
      top.appendChild(document.createTextNode(m.item));
    }
    card.appendChild(top);

    const types = el("div", "types");
    for (const t of info[1]) {
      const b = el("span", "type", t.toUpperCase());
      b.style.background = TYPE_COLORS[t] || "#7D7D7D";
      types.appendChild(b);
    }
    card.appendChild(types);

    const ab = el("div", "line");
    ab.appendChild(el("span", "label", "Ability: "));
    ab.appendChild(document.createTextNode(info[2]));
    card.appendChild(ab);

    const lv = el("div", "line");
    lv.appendChild(el("span", "label", "Level: "));
    lv.appendChild(document.createTextNode("50"));
    card.appendChild(lv);

    if (m.evs) {
      const parts = EV_ORDER.filter(st => m.evs[st] > 0);
      if (parts.length > 0) {
        const ev = el("div", "line");
        ev.appendChild(el("span", "label", "EVs: "));
        parts.forEach((st, i) => {
          if (i > 0) ev.appendChild(el("span", "label", " / "));
          const s = el("span", "", m.evs[st] + " " + st);
          s.style.color = EV_COLORS[st];
          ev.appendChild(s);
        });
        card.appendChild(ev);
      }
    }

    const mv = el("div", "moves");
    if (m.moves.length === 0) mv.appendChild(el("div", "move empty", "No moves"));
    for (const id of m.moves) {
      const row = el("div", "move");
      row.appendChild(el("span", "dash", "-"));
      const name = el("span", "", MOVES[id][0]);
      name.style.color = TYPE_COLORS[MOVES[id][1]] || "#f2f2f2";
      row.appendChild(name);
      mv.appendChild(row);
    }
    card.appendChild(mv);
    grid.appendChild(card);
  }
  main.appendChild(grid);
}

function showLoader(badText) {
  const main = document.getElementById("main");
  main.innerHTML = "";
  const msg = el("div", "msg", "Paste a Team ID or team link from the game to see the team.");
  main.appendChild(msg);
  if (badText) main.appendChild(el("div", "msg bad", "That Team ID isn't valid."));
  const form = el("form", "load");
  const input = el("input");
  input.placeholder = "Team ID or link";
  const btn = el("button", "", "Show Team");
  btn.type = "submit";
  form.appendChild(input);
  form.appendChild(btn);
  form.onsubmit = (e) => {
    e.preventDefault();
    let code = input.value.trim();
    const cut = Math.max(code.lastIndexOf("?"), code.lastIndexOf("#"), code.lastIndexOf("/"), code.lastIndexOf("="));
    if (cut !== -1) code = code.substring(cut + 1);
    if (code !== "") location.search = "?" + code.toLowerCase();
  };
  main.appendChild(form);
}

(function start() {
  const raw = (location.search.substring(1) || location.hash.substring(1)).trim();
  if (raw === "") { showLoader(false); return; }
  const team = decodeTeamId(raw);
  if (team === null) showLoader(true);
  else showTeam(team);
})();
</script>
</body>
</html>
